      }
      .dark {
        --favicon-bg: #14110F !important;
        --favicon-fg: #F9F8F8 !important;
      }

      /* Shape fills mapped to variables */
      .bg-rect { fill: var(--favicon-bg); }
      .fg-path { fill: var(--favicon-fg); }
    </style>
    
